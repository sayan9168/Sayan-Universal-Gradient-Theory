[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sug-theory"
version = "2.0.0"
description = "Sayan Universal Gradient (SUG) Theory -- a speculative framework coupling energy release, thermal gradients and cosmic distance."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sayan M." }]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
plots = ["matplotlib>=3.5"]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["sug_theory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
